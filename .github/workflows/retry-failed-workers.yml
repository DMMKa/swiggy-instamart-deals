name: Auto-Retry Failed Deal Hunter Workers

on:
  workflow_run:
    workflows: ["Swiggy Instamart Keyword Deal Hunter"]
    types: [completed]

jobs:
  auto-retry:
    name: Retry Failed Workers
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt <= 2 }}
    permissions:
      actions: write
    steps:
      - name: Wait 60s for GitHub Runner Pool to Stabilize
        run: |
          echo "Deal Hunter had failed workers (likely due to runner allocation timeout or Swiggy busy)."
          echo "Waiting 60 seconds before triggering auto-retry..."
          sleep 60

      - name: Re-run Failed Workers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Re-running failed workers for Run ID: ${{ github.event.workflow_run.id }} (Run Attempt: ${{ github.event.workflow_run.run_attempt }})..."
          gh run rerun ${{ github.event.workflow_run.id }} --failed
